<title>Jornada Leve</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app styled as a fantasy game client: sticky rank header with crest, gold-framed panels, hextech tab bar. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#010A13; --bg-2:#091428; --surface:#0A1428; --surface-2:#111E33; --line:#463714; --line-bright:#785A28;
  --fg:#F0E6D2; --muted:#A09B8C; --dim:#5B5A56;
  --gold:#C8AA6E; --gold-bright:#F0E6D2; --gold-deep:#785A28; --gold-soft:#1E2328;
  --accent:#0AC8B9; --accent-soft:#0A323C; --on-accent:#CDFAFA;
  --good:#0AC8B9; --good-soft:#06333A; --off:#E0544B; --off-soft:#3A1418;
  --water:#3FA9F5; --water-soft:#0B2340;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --r:2px;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(120% 60% at 50% 0%,#0B2A3D 0%,transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg) 40%);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.04em;font-weight:700;color:var(--gold-bright)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* cabeçalho de elo */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--bg) 85%,transparent);padding-block:12px 14px;display:grid;gap:10px}
.hud-row{display:flex;align-items:center;gap:12px}
.lvl{width:64px;height:70px;flex:none;display:block}
.lvl svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px var(--tier-glow,transparent))}
.who{flex:1;min-width:0}
.who .eyebrow{display:block}
.who h1{font-size:22px;line-height:1.1;text-transform:uppercase;color:var(--tier,var(--gold-bright))}
.who .sub{color:var(--muted);font-size:13.5px}
.streak{display:grid;justify-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold-bright);border:1px solid var(--line-bright);background:var(--gold-soft);padding:4px 10px 3px;min-width:56px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%,0 8px)}
.streak small{font-family:var(--body);font-size:10px;letter-spacing:.12em;color:var(--gold);font-weight:700}
.bar{height:8px;background:#0B0F14;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#005A82,var(--accent));box-shadow:0 0 8px var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}

/* painéis com moldura dourada */
.stack{display:grid;gap:16px}
.card{position:relative;background:linear-gradient(180deg,rgba(17,30,51,.92),rgba(1,10,19,.94));border:1px solid var(--line-bright);border-radius:var(--r);padding:18px 16px 16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(200,170,110,.15)}
.card::before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--bg);border:1px solid var(--gold)}
.card::after{content:"";position:absolute;inset:3px;border:1px solid rgba(70,55,20,.55);pointer-events:none}
.card h2{font-size:17px;text-transform:uppercase}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pts-pill{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap;letter-spacing:.03em}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:2px}
.daynav button{background:var(--gold-soft);border:1px solid var(--line-bright);width:40px;height:40px;font-size:20px;color:var(--gold)}
.daynav button:disabled{opacity:.3;cursor:default}
.daynav .d{text-align:center}
.daynav .d strong{font-family:var(--display);font-size:20px;display:block;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-bright)}
.daynav .d span{font-size:13px;color:var(--muted)}
.today-score{display:flex;gap:10px}
.today-score>div{flex:1;background:var(--gold-soft);border:1px solid var(--line);padding:10px 12px;border-left:3px solid var(--gold)}
.today-score b{font-family:var(--display);font-size:26px;display:block;line-height:1.1;color:var(--gold-bright)}
.today-score span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* refeições */
.meal{display:grid;grid-template-columns:48px 1fr;gap:12px;padding-block:14px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:0}
.meal time{font-family:var(--display);font-weight:700;font-size:15px;color:var(--gold);padding-top:2px}
.meal h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.meal p{margin:3px 0 10px;color:var(--muted);font-size:14.5px}
.meal .content{min-width:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.photo-btn{border:1px solid var(--line-bright);background:#1E2328;color:var(--gold-bright);padding:8px 12px;font-weight:600;font-size:14px;letter-spacing:.02em}
.seg button.on-good{background:linear-gradient(180deg,#0A5A63,#063A44);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 10px rgba(10,200,185,.35)}
.seg button.on-off{background:var(--off-soft);border-color:var(--off);color:#FFB4AE}
.photo-btn{border-style:dashed;border-color:var(--accent);color:var(--accent);background:transparent}
.photo-btn[disabled]{opacity:.6}
.bonus{margin-top:6px;padding:10px 12px;background:linear-gradient(90deg,rgba(200,170,110,.22),rgba(200,170,110,.05));border:1px solid var(--gold);color:var(--gold-bright);font-weight:700;font-size:14px;display:flex;justify-content:space-between;letter-spacing:.04em;text-transform:uppercase}
.seg button.on-skip{background:#1E2328;border-color:var(--muted);color:var(--fg);box-shadow:inset 0 0 0 1px var(--muted)}
.seg button.on-free{background:linear-gradient(180deg,#C8AA6E,#785A28);border-color:var(--gold-bright);color:#010A13;box-shadow:0 0 10px rgba(200,170,110,.45)}
.treat .head{display:flex;align-items:center;gap:12px}
.treat .em{font-size:30px;width:52px;height:56px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#3B2E12,#0B0F14 70%);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.treat .tx{flex:1;min-width:0}
.treat .tx b{font-family:var(--display);font-size:16px;color:var(--gold-bright);letter-spacing:.04em;display:block}
.treat .tx span{font-size:14px;color:var(--muted)}
.treat .bar{margin-top:12px}
.treat .bar i{background:linear-gradient(90deg,var(--gold-deep),var(--gold-bright));box-shadow:0 0 8px var(--gold)}
.pips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.pips div{text-align:center;font-size:11px;color:var(--dim);letter-spacing:.06em}
.pips i{display:block;height:6px;margin-bottom:4px;background:#1E2328;border:1px solid var(--line)}
.pips .p4 i{background:var(--gold);border-color:var(--gold-bright)}
.pips .p3 i{background:var(--gold-deep)}
.pips .p1 i,.pips .p2 i{background:#3B2E12}
.pips .now{color:var(--gold-bright)}
.treat.ready{border-color:var(--gold-bright);box-shadow:0 0 22px rgba(200,170,110,.25),inset 0 0 0 1px rgba(0,0,0,.6)}
.choice{display:flex;gap:8px}
.choice button{flex:1;border:1px solid var(--line-bright);background:#1E2328;color:var(--muted);padding:10px;font-weight:700;letter-spacing:.04em}
.choice button[aria-pressed="true"]{border-color:var(--accent);color:var(--on-accent);background:linear-gradient(180deg,#0A3C46,#05202A)}
.bonus.locked{background:transparent;border-color:var(--line);color:var(--dim)}
.review{display:grid;grid-template-columns:64px 1fr;gap:10px;margin-top:10px;padding:10px;background:#0B0F14;border:1px solid var(--line);align-items:start}
.review img{width:64px;height:64px;object-fit:cover;display:block;border:1px solid var(--gold-deep)}
.review .nota{font-family:var(--display);font-weight:800;font-size:19px;color:var(--gold-bright)}
.review .nota small{font-family:var(--body);font-size:12.5px;color:var(--accent);font-weight:700;margin-left:6px}
.review p{margin:2px 0 0;font-size:14px;color:var(--fg)}
.review .x{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:4px 0;text-decoration:underline}
.opt-toggle{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:700;padding:0;margin:-4px 0 10px;letter-spacing:.02em}
.opts{margin:-2px 0 12px;padding:10px;border:1px solid var(--line);background:#0B0F14;display:grid;gap:10px}
.opts .gname{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:#1E2328;color:var(--fg);padding:6px 9px;font-size:13px;line-height:1.2;text-align:left}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--on-accent);background:var(--accent-soft)}
.opts .reset{border:0;background:transparent;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0;justify-self:start}
.how{font-size:12.5px;color:var(--muted);margin:-2px 0 14px;letter-spacing:.02em}

/* água */
.wgauge{display:flex;align-items:flex-end;gap:14px}
.wgauge .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--water);text-shadow:0 0 14px rgba(63,169,245,.4)}
.wgauge .of{color:var(--muted);font-size:14.5px;padding-bottom:4px}
.wbar{height:14px;background:#0B0F14;border:1px solid #1B3B5E;overflow:hidden;margin-top:12px}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,#0B4F8A,var(--water));box-shadow:0 0 10px var(--water);transition:width .4s}
.wbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wbtns button{flex:1 1 auto;border:1px solid #1B5A8E;background:var(--water-soft);color:#BFE3FF;padding:9px 10px;font-weight:700;font-size:14.5px}
.wbtns button.minus{flex:0 0 auto;border-color:var(--line);background:transparent;color:var(--muted)}

/* jejum */
.fast{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:#1E2328}
.ring .prog{stroke:var(--gold);transition:stroke-dashoffset .6s;filter:drop-shadow(0 0 4px rgba(200,170,110,.6))}
.ring text{fill:var(--gold-bright);font-family:var(--display);font-weight:800;font-size:19px}
.ring .t2{fill:var(--muted);font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.1em}
.fast .ctl{display:grid;gap:8px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border:1px solid var(--line-bright);background:#1E2328;font-size:18px;font-weight:700;color:var(--gold)}
.stepper output{font-family:var(--display);font-weight:800;font-size:20px;min-width:58px;text-align:center;color:var(--gold-bright)}
.btn{border:2px solid var(--accent);padding:11px 16px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(180deg,#0A3C46,#05202A);color:var(--on-accent);box-shadow:0 0 14px rgba(10,200,185,.25),inset 0 0 12px rgba(10,200,185,.2)}
.btn.ghost{border:1px solid var(--line-bright);background:#1E2328;color:var(--gold-bright);box-shadow:none}
.btn.block{width:100%}

/* hábitos */
.habit{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);background:rgba(30,35,40,.6);width:100%;text-align:left}
.habit + .habit{margin-top:8px}
.habit .ico{width:40px;height:40px;background:#0B0F14;border:1px solid var(--line-bright);display:grid;place-items:center;font-size:19px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.habit .tx{flex:1;min-width:0}
.habit .tx b{display:block;font-size:15.5px;font-weight:600}
.habit .tx span{font-size:13px;color:var(--muted)}
.habit .chk{width:24px;height:24px;border:1px solid var(--line-bright);display:grid;place-items:center;flex:none;font-weight:800;color:transparent;transform:rotate(45deg)}
.habit .chk::before{content:"";width:10px;height:10px;background:transparent}
.habit.done{border-color:var(--accent);background:linear-gradient(90deg,rgba(10,200,185,.16),rgba(10,200,185,.02))}
.habit.done .chk{border-color:var(--accent)}
.habit.done .chk::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.habit[disabled]{cursor:default;opacity:.85}

/* progresso */
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bigstats div{background:#0B0F14;border:1px solid var(--line);padding:10px}
.bigstats b{display:block;font-family:var(--display);font-size:21px;line-height:1.1;color:var(--gold-bright)}
.bigstats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chart{width:100%;height:auto;display:block;margin-top:14px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .grid{stroke:#1E2328;stroke-width:1}
.chart .goal{stroke:var(--gold);stroke-dasharray:5 4;stroke-width:1.5}
.chart .line{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(10,200,185,.6))}
.chart .area{fill:var(--accent-soft);stroke:none}
.chart .dot{fill:var(--accent)}
.chart .last{fill:var(--bg);stroke:var(--gold-bright);stroke-width:3}
.weigh{display:flex;gap:8px;margin-top:14px}
.weigh input{flex:1;min-width:0}
input[type=number],input[type=text]{border:1px solid var(--line-bright);background:#0B0F14;color:var(--fg);border-radius:0;padding:10px 12px;font:inherit;font-size:16px;width:100%}
input::placeholder{color:var(--dim)}
.history{display:grid;gap:0;margin-top:10px;font-size:15px}
.history div{display:flex;justify-content:space-between;padding-block:7px;border-top:1px solid var(--line)}
.history span{color:var(--muted)}

/* prêmios */
.reward{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-block:12px;border-top:1px solid var(--line);align-items:center}
.reward:first-of-type{border-top:0;padding-top:0}
.reward b{font-size:16px;font-weight:600}
.reward .need{font-size:13px;color:var(--muted)}
.reward .bar{grid-column:1/-1;height:6px}
.reward.ready .bar i{background:linear-gradient(90deg,var(--gold-deep),var(--gold-bright));box-shadow:0 0 8px var(--gold)}
.reward.claimed b{text-decoration:line-through;color:var(--muted)}
.tag{font-size:12.5px;font-weight:700;padding:5px 10px;background:#1E2328;color:var(--muted);border:1px solid var(--line);letter-spacing:.04em}
.tag.ready{background:linear-gradient(180deg,#C8AA6E,#785A28);color:#010A13;border-color:var(--gold-bright);text-transform:uppercase}
.tag.claimed{background:var(--good-soft);color:var(--accent);border-color:var(--accent)}
.reward-edit{display:grid;grid-template-columns:1fr 96px;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.reward-edit .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.add-reward{display:grid;grid-template-columns:1fr 92px auto;gap:8px;margin-top:12px}
.add-reward .btn{padding:8px 14px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{padding:12px 6px;text-align:center;min-width:0}
.badge .em{font-size:24px;width:58px;height:64px;margin:0 auto;display:grid;place-items:center;background:#0B0F14;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);filter:grayscale(1);opacity:.35;box-shadow:inset 0 0 0 2px var(--line)}
.badge b{display:block;font-size:13px;margin-top:6px;line-height:1.2;font-weight:700;color:var(--dim)}
.badge span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.25}
.badge.got .em{filter:none;opacity:1;background:radial-gradient(circle at 50% 35%,#3B2E12,#0B0F14 70%)}
.badge.got b{color:var(--gold-bright)}
.badge.got span{color:var(--muted)}
button.badge{border:1px solid transparent;background:transparent;color:inherit;font:inherit;cursor:pointer}
button.badge[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.badge .prize{display:block;font-size:11px;color:var(--accent);margin-top:4px;line-height:1.2}
.badge.got .prize{color:var(--gold-bright)}
.badge .prize.claimed{color:var(--dim);text-decoration:line-through}
.bpanel{margin-top:14px;padding:12px;border:1px solid var(--gold-deep);background:#0B0F14;display:grid;gap:10px}
.bpanel .top{display:flex;gap:10px;align-items:center}
.bpanel .top b{font-family:var(--display);color:var(--gold-bright);letter-spacing:.04em}
.bpanel .top span{display:block;font-size:13px;color:var(--muted)}
.bpanel form{display:flex;gap:8px}
.bpanel form input{flex:1;min-width:0}
.track{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.track:first-of-type{border-top:0;padding-top:0}
.track .crest{width:44px;height:48px}
.track .crest svg{width:100%;height:100%;display:block}
.track .tt{min-width:0}
.track .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.track .row1 b{font-size:15.5px;font-weight:700}
.track .row1 span{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.track .bar{margin-top:6px;height:6px}
.track .nx{font-size:12.5px;color:var(--muted);margin-top:4px}
.lb{display:grid;gap:0}
.lb-row{display:grid;grid-template-columns:28px 40px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0;padding-top:0}
.lb-row .pos{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.lb-row:nth-child(1) .pos{color:#F7DD8C}.lb-row:nth-child(2) .pos{color:#AEB8C2}.lb-row:nth-child(3) .pos{color:#B87A4B}
.lb-row .em{width:40px;height:44px}.lb-row .em svg{width:100%;height:100%;display:block}
.lb-row .nm{min-width:0}
.lb-row .nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .nm span{font-size:12.5px;color:var(--muted)}
.lb-row .sc{text-align:right;font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold-bright)}
.lb-row .sc small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.lb-row.me{background:linear-gradient(90deg,rgba(10,200,185,.14),transparent);box-shadow:inset 3px 0 0 var(--accent)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.toggle b{font-weight:600}
.toggle span.sw{width:42px;height:24px;border:1px solid var(--line-bright);background:#0B0F14;position:relative;flex:none}
.toggle span.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--dim);transition:left .2s}
.toggle[aria-checked="true"] span.sw{border-color:var(--accent)}
.toggle[aria-checked="true"] span.sw::after{left:21px;background:var(--accent);box-shadow:0 0 8px var(--accent)}

<script>
(() => {
// ---------- conteúdo do plano ----------
const WEEKS = [
  {nome:"Semana 1 · arroz e frango", cafe:"2 fatias de pão integral, 2 ovos e 1 colher de requeijão light", prato:"Arroz 100 g + frango desfiado 120 g", lanche:"7 Magic Toast + frango desfiado 80 g + requeijão light"},
  {nome:"Semana 2 · batata doce e carne", cafe:"Tapioca 45 g + 2 ovos + requeijão light", prato:"Batata doce 141 g + carne grelhada 89 g", lanche:"Whey 30 g + 100 ml de leite desnatado + banana"},
  {nome:"Semana 3 · macarrão e carne moída", cafe:"7 bolachas de arroz + atum 80 g + requeijão light", prato:"Macarrão 100 g + carne moída 63 g", lanche:"7 Magic Toast + frango desfiado 80 g + requeijão light"},
  {nome:"Semana 4 · mandioca e peixe", cafe:"7 Magic Toast + 2 ovos + requeijão light", prato:"Mandioca 107 g + filé de peixe 115 g", lanche:"Whey 30 g + 100 ml de leite desnatado + banana"},
];
const MEALS = [
  {id:"cafe", hora:"09h", nome:"Café da manhã", txt:w=>w.cafe},
  {id:"almoco", hora:"13h", nome:"Almoço", txt:w=>w.prato+", com salada e legumes à vontade"},
  {id:"lanche", hora:"16h", nome:"Lanche", txt:w=>w.lanche},
  {id:"jantar", hora:"22h", nome:"Jantar", txt:w=>w.prato+", com salada e legumes à vontade"},
];
// Opções e substituições do plano da nutricionista (mesmas quantidades do plano)
const CARB_PRATO = ["Arroz branco 100 g (4 col. sopa)","Batata inglesa cozida 250 g","Batata inglesa assada 145 g","Batata doce cozida 141 g","Batata doce assada 89 g","Mandioca cozida 107 g","Mandioquinha 123 g","Macarrão cozido 100 g"];
const PROT_PRATO = ["Frango desfiado 120 g","Filé de frango grelhado 100 g","Sobrecoxa assada 73,5 g","Carne grelhada ou assada 89 g","Carne refogada 96 g","Filé de peixe 115 g","Peito de frango cozido 120 g","Peito de frango grelhado 122 g","Carne moída refogada 63 g","3 ovos"];
const OPTS = {
  cafe:   {groups:[["Base", ["Pão integral 2 fatias (50 g)","Tapioca 45 g","Magic Toast 7 un.","Bolacha de arroz 7 un."]], ["Proteína", ["2 ovos","Frango desfiado 100 g","Atum 80 g","Whey 30 g"]]], extra:"requeijão light 30 g", alts:["Crepioca (opção 2 do plano)"]},
  almoco: {groups:[["Carboidrato", CARB_PRATO], ["Proteína", PROT_PRATO]], extra:"salada e legumes à vontade", alts:[]},
  lanche: {groups:[], alts:["7 Magic Toast + frango desfiado 80 g + requeijão light 30 g","Whey 30 g + 100 ml de leite desnatado + banana"]},
  jantar: {groups:[["Carboidrato", CARB_PRATO], ["Proteína", PROT_PRATO]], extra:"salada e legumes à vontade", alts:[]},
};
// escolha padrão de cada semana do rodízio: [café, prato, lanche]
const WEEK_PICKS = [
  {cafe:{g:[0,0]}, prato:{g:[0,0]}, lanche:{a:0}},
  {cafe:{g:[1,0]}, prato:{g:[3,3]}, lanche:{a:1}},
  {cafe:{g:[3,2]}, prato:{g:[7,8]}, lanche:{a:0}},
  {cafe:{g:[2,0]}, prato:{g:[5,5]}, lanche:{a:1}},
];
const weekPick = (d, id) => { const w = WEEK_PICKS[weekOf(d)]; return id==="almoco"||id==="jantar" ? w.prato : w[id]; };
const pickOf = (d, id) => S.days[d]?.pick?.[id] || weekPick(d, id);
function pickText(id, pk){
  const o = OPTS[id];
  if (pk.a!=null) return o.alts[pk.a];
  return o.groups.map((g,i)=>g[1][pk.g[i]]).join(" + ") + (o.extra ? ` + ${o.extra}` : "");
}
const mealText = (d, m) => S.profile?.showMenu===false ? "Siga o seu plano alimentar" : pickText(m.id, pickOf(d, m.id));
const menuText = (m,w) => mealText(S.day, m);
// Pontos de cada hábito
const P = {mealOn:20, mealOff:-20, perfect:30, photoMax:15, per100ml:1, waterGoal:15, fastGoal:30, fastHour:2, weigh:10};
const HABITS = [
  {id:"refeicoes", ico:"🍽️", nome:"Refeições do plano", desc:"Marque cada refeição ou mande foto. +20 no plano, −20 se fugir, 0 se pular, até +15 pela foto, +30 no dia perfeito", fixed:true},
  {id:"agua", ico:"💧", nome:"Água", desc:"Meta em litros. +1 a cada 100 ml, +15 ao bater a meta"},
  {id:"jejum", ico:"⏳", nome:"Jejum", desc:"Do jantar ao café. +2 por hora, +30 ao bater a meta"},
  {id:"exercicio", ico:"🏃", nome:"30 min de exercício", desc:"Caminhada, academia, bike", pts:25, check:true},
  {id:"sono", ico:"😴", nome:"Dormir 7 h ou mais", desc:"Sono ajuda a controlar a fome", pts:10, check:true},
  {id:"semdoce", ico:"🍬", nome:"Dia sem doces", desc:"Nada fora do plano com açúcar", pts:15, check:true},
  {id:"semrefri", ico:"🥤", nome:"Sem refrigerante ou álcool", desc:"Só água, chá ou café sem açúcar", pts:10, check:true},
  {id:"passos", ico:"🫀", nome:"40 min de cardio", desc:"Esteira, bike, elíptico, corrida", pts:25, check:true},
  {id:"pesagem", ico:"⚖️", nome:"Pesagem", desc:"Registre o peso na aba Progresso. +10 por pesagem"},
];
const LEVEL_NAMES = ["Ferro","Bronze","Prata","Ouro","Platina","Esmeralda","Diamante","Mestre","Grão-Mestre","Desafiante"];
const TIER = ["#8C7F75","#B87A4B","#AEB8C2","#E3C27A","#5FC6C0","#2FBF7A","#7FA8FF","#C27BEA","#F0605A","#F7DD8C"];
// 7 elos com divisões IV a I (níveis 1 a 28), depois Mestre (29), Grão-Mestre (30) e Desafiante (31+)
const MAX_DIV = 28;
const tierIdx = n => n<=MAX_DIV ? Math.floor((n-1)/4) : Math.min(9, 7+(n-MAX_DIV-1));
const division = n => n<=MAX_DIV ? ["IV","III","II","I"][(n-1)%4] : "";
const tierColor = n => TIER[tierIdx(n)];
function emblem(n){
  const c = tierColor(n), id = "g"+n+Math.random().toString(36).slice(2,6);
  return `<svg viewBox="0 0 64 70" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#0A1428"/></linearGradient></defs>
  <path d="M32 2 L60 16 L60 46 L32 68 L4 46 L4 16 Z" fill="url(#${id})" stroke="#C8AA6E" stroke-width="2"/>
  <path d="M32 9 L54 20 L54 43 L32 60 L10 43 L10 20 Z" fill="#010A13" fill-opacity=".55" stroke="${c}" stroke-width="1.2"/>
  ${n>MAX_DIV?`<path d="M18 9 L24 2 L32 8 L40 2 L46 9" fill="none" stroke="#F0E6D2" stroke-width="1.6"/>`:""}
  <text x="32" y="42" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-weight="800" font-size="22" fill="#F0E6D2">${division(n)||"★"}</text></svg>`;
}
const levelAt = n => n<=1 ? 0 : Math.round(145*Math.pow(n-1,1.8)/50)*50;   // pontos acumulados para chegar ao nível n (Desafiante perto de 1 ano de dias bons)
const levelName = n => LEVEL_NAMES[tierIdx(n)] + (division(n)?" "+division(n):"") + (n>MAX_DIV+3?` +${n-MAX_DIV-3}`:"");

// ---------- datas ----------
const iso = d => d.toLocaleDateString("sv-SE");
const today = () => iso(new Date());
const addDays = (s,n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const weekOf = s => { const dd = +s.slice(8,10); return dd>28 ? 0 : Math.floor((dd-1)/7); };
const fmtDay = s => new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = s => new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const kg = v => v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});

// ---------- estado e armazenamento ----------
let rankDb = null, rankUser = null, myId = null, lastRank = "";
const R_ = {rows:[], names:{}, mode:"semana", ok:false};
const S = {profile:null, days:{}, ready:false, cloud:false, tab:"hoje", day:today(), photoOk:false, busy:{}};
let sampleFn = null;
const LS = "jornada-leve-v1";
try { const c = JSON.parse(localStorage.getItem(LS)||"null"); if (c) { S.profile=c.profile; S.days=c.days||{}; } } catch {}
const cache = () => { try { localStorage.setItem(LS, JSON.stringify({profile:S.profile, days:S.days})); } catch {} };
let col = null;
const chains = {};
function writeDoc(key, data){
  cache();
  if (!col) return;
  chains[key] = (chains[key]||Promise.resolve()).then(()=>col.doc(key).set(JSON.parse(JSON.stringify(data)))).catch(e=>console.warn("save",e));
}
const timers = {};
function saveDay(d, delay=0){ clearTimeout(timers[d]); timers[d]=setTimeout(()=>writeDoc("day-"+d, S.days[d]||{}), delay); cache(); }
function saveProfile(){ writeDoc("profile", S.profile); }

async function connectSample(){
  try { const s = await claude.use("sample"); if (!s) return; const lim = await s.limits().catch(()=>null);
    if (lim?.images){ sampleFn = s; S.photoOk = true; render(); } } catch {}
}
async function shrink(file, max, q){
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const k = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    if (max<=200){ const s=Math.min(c.width,c.height); c.width=c.height=Math.min(s,160); const sw=Math.min(img.naturalWidth,img.naturalHeight);
      c.getContext("2d").drawImage(img,(img.naturalWidth-sw)/2,(img.naturalHeight-sw)/2,sw,sw,0,0,c.width,c.height); return c.toDataURL("image/jpeg",q); }
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(ok,"image/jpeg",q));
  } finally { URL.revokeObjectURL(url); }
}
function pickPhoto(d, mealId, w){
  const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange = async () => { const f = inp.files?.[0]; if (!f) return;
    const meal = MEALS.find(m=>m.id===mealId); S.busy[d+mealId]=true; render();
    try {
      const [big, thumb] = await Promise.all([shrink(f,1024,.82), shrink(f,160,.6)]);
      const prompt = `Você é o avaliador de um jogo de emagrecimento. A pessoa segue um plano de nutricionista e mandou a foto da refeição "${meal.nome}".
Refeição prevista no plano para esta semana: ${S.profile.showMenu===false?"não informada; avalie se parece uma refeição equilibrada de dieta":mealText(d, meal)}.
Regras do plano: metade do prato com salada e legumes; carboidrato e proteína nas quantidades indicadas; nada frito, doce ou refrigerante fora do plano. As gramas são do alimento pronto.
Avalie a foto e responda SÓ com JSON: {"nota": inteiro 0 a 10 (10 = exatamente o plano, 7-9 = no plano com pequenas diferenças, 4-6 = parecido mas com porção ou item fora, 0-3 = fora do plano), "no_plano": true ou false, "porcao": "certa" | "pouca" | "muita", "vistos": [até 5 alimentos que você vê], "comentario": "uma ou duas frases em português do Brasil, tom de treinador animado e gentil, dizendo o que ficou bom e uma dica"}.
Se a foto não for de comida, dê nota 0 e diga isso no comentário.`;
      const r = await sampleFn.json(prompt, {images:[big]});
      const nota = Math.max(0, Math.min(10, Math.round(+r.nota||0)));
      act(()=>{ const dd = dayData(d); dd.photos ||= {}; dd.meals ||= {};
        dd.photos[mealId] = {nota, porcao:String(r.porcao||"").slice(0,10), comentario:String(r.comentario||"").slice(0,280), vistos:(r.vistos||[]).slice(0,5).map(String), thumb, at:Date.now()};
        dd.meals[mealId] = (r.no_plano && nota>=6) ? "on" : "off"; delete S.busy[d+mealId]; saveDay(d); });
    } catch(e){
      delete S.busy[d+mealId]; render();
      const msg = {not_granted:"Sem permissão para o Claude ver a foto. Você ainda pode marcar na mão.", rate_limited:"Muitas fotos seguidas. Tente de novo em instantes.", image_rejected:"Essa imagem não foi aceita. Tente outra foto."}[e?.code] || "Não deu para avaliar a foto agora. Tente de novo.";
      toast(msg);
    }
  };
  inp.click();
}
async function connect(){
  if (!window.claude?.use) return finishBoot();
  connectSample();
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const id = db && user ? await user.id() : null;
    if (!db || !id) return finishBoot();
    col = db.collection("data/users/"+id);
    rankDb = db; rankUser = user; myId = id;
    db.collection("ranking").onSnapshot(async snap => {
      R_.rows = snap.docs.map(d=>({id:d.id, ...d.data()})); R_.ok = true;
      try { const ps = await user.profiles(R_.rows.map(r=>r.id)); for (const r of R_.rows) R_.names[r.id] = ps?.[r.id]?.name || ""; } catch {}
      if (S.tab==="ranking") render();
    }, err => console.warn("ranking", err));
    let first = true;
    col.onSnapshot(snap => {
      if (snap.metadata?.hasPendingWrites) return;
      const days = {}; let profile = null;
      snap.docs.forEach(doc => {
        if (doc.id==="profile") profile = doc.data();
        else if (doc.id.startsWith("day-")) days[doc.id.slice(4)] = doc.data();
      });
      if (first && !profile && S.profile){            // primeira vez na nuvem: sobe o que estava no aparelho
        writeDoc("profile", S.profile);
        Object.entries(S.days).forEach(([d,v])=>writeDoc("day-"+d, v));
      } else {
        S.profile = profile ? structuredClone(profile) : S.profile;
        for (const [d,v] of Object.entries(days)) S.days[d] = structuredClone(v);
      }
      first = false; S.cloud = true; cache(); finishBoot();
    }, err => { console.warn(err); finishBoot(); });
  } catch(e){ console.warn(e); finishBoot(); }
}
function finishBoot(){ S.ready = true; render(); }
function weekPoints(){ const per = (()=>{ const d=today(), x=new Date(d+"T12:00:00"); return addDays(d,-((x.getDay()+6)%7)); })();
  let t=0; for (let i=0;i<7;i++) t += dayPoints(addDays(per,i)); return {pts:t, week:per}; }
let rankTimer = null;
function syncRank(){
  clearTimeout(rankTimer);
  rankTimer = setTimeout(async () => {
    if (!rankDb || !myId || !S.profile?.ranking?.on) return;
    const s = stats(), w = weekPoints();
    const doc = {level:s.level, total:s.total, week:w.week, weekPts:w.pts, streak:s.streak, best:s.best, perfect:s.perfect, updated:today()};
    if (S.profile.ranking.kg) doc.lost = Math.round(s.lost*10)/10;
    const key = JSON.stringify(doc); if (key===lastRank) return; lastRank = key;
    try { await rankDb.doc("ranking/"+myId).set(doc); } catch(e){ console.warn("ranking", e); lastRank=""; toast("Não deu para atualizar o ranking. Peça ao dono do jogo acesso de Colaborador."); }
  }, 1500);
}

// ---------- regras do jogo ----------
const on = id => !!S.profile?.habits?.includes(id);
const waterMl = v => v?.waterMl ?? (v?.water||0)*250;              // dias antigos guardavam copos de 250 ml
const goalMl = () => Math.round((S.profile.waterL ?? (S.profile.waterGoal||8)*0.25)*1000);
const L = ml => (ml/1000).toLocaleString("pt-BR",{minimumFractionDigits:ml%1000?1:0,maximumFractionDigits:2});
const photoPts = ph => ph ? Math.round(Math.max(0,Math.min(10,ph.nota||0))*P.photoMax/10) : 0;
function dayPoints(d, v){
  v = v || S.days[d] || {}; const p = S.profile; let pts = 0;
  const meals = v.meals||{};
  let onPlan = 0;
  for (const m of MEALS){ if (meals[m.id]==="on"){pts+=P.mealOn;onPlan++;} else if (meals[m.id]==="off") pts+=P.mealOff; pts+=photoPts(v.photos?.[m.id]); }
  if (onPlan===4) pts+=P.perfect;
  if (on("agua")){ const ml=waterMl(v), g=goalMl(); pts += Math.floor(Math.min(ml,g)/100)*P.per100ml; if (ml>=g) pts+=P.waterGoal; }
  if (on("jejum") && v.fast){ pts += Math.floor(Math.min(v.fast,20))*P.fastHour; if (v.fast>=p.fastGoal) pts+=P.fastGoal; }
  for (const h of HABITS) if (h.check && on(h.id) && v.checks?.[h.id]) pts+=h.pts;
  if (v.weight) pts+=P.weigh;
  return pts;
}
const onPlanCount = v => MEALS.filter(m=>v?.meals?.[m.id]==="on").length;
const keptCount = v => MEALS.filter(m=>["on","free"].includes(v?.meals?.[m.id])).length;   // refeição livre não quebra a sequência
const freeCount = v => MEALS.filter(m=>v?.meals?.[m.id]==="free").length;

// ---------- refeição livre (missão da semana ou do mês) ----------
const treat = () => ({title:"Pizza", em:"🍕", period:"semana", pct:90, ...(S.profile?.treat||{})});
function periodOf(d){
  const t = treat(), x = new Date(d+"T12:00:00");
  if (t.period==="mes"){ const a = iso(new Date(x.getFullYear(), x.getMonth(), 1, 12)); const b = iso(new Date(x.getFullYear(), x.getMonth()+1, 0, 12)); return {start:a, end:b}; }
  const back = (x.getDay()+6)%7; const a = addDays(d,-back); return {start:a, end:addDays(a,6)};
}
function periodStats(per){
  let on = 0, free = 0, n = 0;
  for (let d = per.start; d <= per.end; d = addDays(d,1)){ n++; const v=S.days[d]; on += onPlanCount(v); free += freeCount(v); }
  const need = Math.ceil(n*4*treat().pct/100);
  return {on, free, need, days:n, done:on>=need};
}
function treatState(){
  // percorre os períodos desde o primeiro registro; cada período batido dá 1 refeição livre que vale até o fim do período seguinte
  const ds = Object.keys(S.days).sort(); const cur = periodOf(today());
  let per = periodOf(ds[0] && ds[0] < cur.start ? ds[0] : today()), carry = 0, avail = 0, st = null;
  for (let guard=0; guard<200; guard++){
    st = periodStats(per);
    const earned = st.done ? 1 : 0;
    let spend = st.free, fromCarry = Math.min(carry, spend); spend -= fromCarry;
    const fromNew = Math.min(earned, spend);
    avail = (carry - fromCarry) + (earned - fromNew);
    if (per.start === cur.start) break;
    carry = earned - fromNew;
    per = periodOf(addDays(per.end,1));
  }
  return {...st, per:cur, avail};
}
function stats(){
  const ds = Object.keys(S.days).sort();
  let total = 0, photos = 0, perfect = 0, mealsOn = 0, waterDays = 0, fastDays = 0, active = 0, weighs = 0, cleanDays = 0;
  for (const d of ds){ const v=S.days[d]; total+=dayPoints(d,v); const n=onPlanCount(v); mealsOn+=n; if(n===4)perfect++;
    if (on("agua") && waterMl(v)>=goalMl()) waterDays++;
    if (on("jejum") && (v.fast||0)>=S.profile.fastGoal) fastDays++;
    if (v.checks?.exercicio) active++; if (v.checks?.semdoce) cleanDays++; if (v.weight) weighs++; photos += Object.keys(v.photos||{}).length; }
  // sequência: dias seguidos com 3+ refeições no plano (hoje conta se já bateu)
  let streak = 0, d = today();
  if (keptCount(S.days[d])<3) d = addDays(d,-1);
  while (keptCount(S.days[d])>=3){ streak++; d = addDays(d,-1); }
  let best = 0, run = 0, prev = null;
  for (const x of ds){ if (keptCount(S.days[x])>=3){ run = (prev && addDays(prev,1)===x) ? run+1 : 1; prev = x; best=Math.max(best,run);} }
  const weights = ds.filter(x=>S.days[x].weight).map(x=>({d:x,w:+S.days[x].weight}));
  const start = +S.profile.startWeight, goal = +S.profile.goalWeight;
  const cur = weights.length ? weights[weights.length-1].w : start;
  const lost = Math.max(0, start-cur);
  let level = 1; while (total>=levelAt(level+1)) level++;
  return {total, photos, perfect, mealsOn, waterDays, fastDays, active, weighs, cleanDays, streak, best, weights, start, goal, cur, lost, level};
}

function toast(msg, gold){ const box=document.getElementById("toasts"); box.querySelectorAll(".toast:not(.gold)").forEach(x=>{ if(!gold) x.remove(); }); while(box.children.length>2) box.firstChild.remove(); const t=document.createElement("div"); t.className="toast"+(gold?" gold":""); t.textContent=msg; document.getElementById("toasts").append(t); setTimeout(()=>t.remove(), 2200); }
function modal(em, title, text){
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><div class="card"><div class="big">${em}</div><h2></h2><p></p><button class="btn block" id="mclose">Continuar</button></div></div>`;
  m.querySelector("h2").textContent = title; m.querySelector("p").textContent = text;
  m.querySelector("#mclose").onclick = () => m.innerHTML = "";
}
function act(fn){
  const before = stats(), got = new Set(badgeList().filter(b=>b.ok(before)).map(b=>b.id));
  const freeBefore = treatState().avail;
  const readyBefore = new Set((S.profile.rewards||[]).filter(r=>before.total>=r.points).map(r=>r.id));
  fn();
  const after = stats(), diff = after.total-before.total;
  syncRank();
  if (diff>0) toast(`+${diff} pontos`); else if (diff<0) toast(`${diff} pontos`);
  for (const t of trackList()){ const a=trackTier(t,before), b=trackTier(t,after); if (b>a) toast(`${t.nome}: elo ${LEVEL_NAMES[b-1]} ${t.ico}`, true); }
  let prizeBadge = null;
  for (const b of badgeList()) if (!got.has(b.id) && b.ok(after)){ toast(`Conquista: ${b.nome} ${b.em}`, true); if (badgePrize(b.id)) prizeBadge = b; }
  const newReward = (S.profile.rewards||[]).find(r=>!readyBefore.has(r.id) && after.total>=r.points && !r.claimed);
  const freeAfter = treatState().avail;
  if (prizeBadge) modal(prizeBadge.em,`Conquista: ${prizeBadge.nome}`,`Você ganhou: ${badgePrize(prizeBadge.id)}. Resgate na aba Prêmios.`);
  else if (freeAfter>freeBefore){ const t=treat(); modal(t.em,`${t.title} liberada!`,`Você cumpriu a missão ${t.period==="mes"?"do mês":"da semana"}. Tem direito a 1 refeição livre: marque "${t.em} Livre" na refeição em que for usar.`); }
  else if (newReward) modal("🎁","Recompensa liberada!",`Você juntou ${newReward.points.toLocaleString("pt-BR")} pontos e ganhou: ${newReward.title}. Resgate na aba Prêmios.`);
  else if (after.level>before.level) modal(emblem(after.level), tierIdx(after.level)>tierIdx(before.level)?`Promovido: ${levelName(after.level)}`:`Subiu para ${levelName(after.level)}`,`Você chegou ao nível ${after.level} de 31. Faltam ${(levelAt(after.level+1)-after.total).toLocaleString("pt-BR")} pontos para o próximo.`);
  render();
}

function treatCard(){

  const left = Math.max(0, ts.need-ts.on), pct = Math.min(100, Math.round(ts.on/ts.need*100));
  const endTxt = mes ? "até o fim do mês" : "até domingo";
  const status = ts.avail>0 ? `Liberada! Você tem ${ts.avail} refeição livre${ts.avail>1?"s":""} para usar.`
    : ts.done ? `Missão cumprida e refeição livre já usada.` : `Faltam ${left} refeições no plano ${endTxt}.`;
  let pips = "";
  if (!mes){ const names=["S","T","Q","Q","S","S","D"]; for (let i=0;i<7;i++){ const d=addDays(ts.per.start,i); const n=keptCount(S.days[d]);
    pips += `<div class="p${n} ${d===today()?"now":""}"><i></i>${names[i]}</div>`; } }
  return `<section class="card treat ${ts.avail>0?"ready":""}"><div class="card-head"><h2>Missão ${mes?"do mês":"da semana"}</h2><span class="eyebrow num">${ts.on}/${ts.need}</span></div>

    <p class="note" style="margin:10px 0 0">Meta: ${t.pct}% das refeições ${mes?"do mês":"da semana"} no plano. A refeição livre vale até o fim ${mes?"do mês":"da semana"} seguinte e não quebra sua sequência.</p></section>`;
}

function chart(s){
  const pts = [{d:"início",w:s.start}, ...s.weights.map(x=>({d:fmtShort(x.d),w:x.w}))];
  if (pts.length<2) return `<p class="note" style="margin-top:12px">O gráfico aparece depois da primeira pesagem.</p>`;
  const W=320,H=150,L=34,R=12,T=12,B=22;
  const ws = pts.map(p=>p.w).concat(s.goal);
  let lo=Math.floor(Math.min(...ws)-1), hi=Math.ceil(Math.max(...ws)+1);
  const x=i=>L+(W-L-R)*(i/(pts.length-1)), y=w=>T+(H-T-B)*(1-(w-lo)/(hi-lo));
  const step = Math.max(1, Math.ceil((hi-lo)/4));
  let grid=""; for (let v=lo; v<=hi; v+=step) grid+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const line = pts.map((p,i)=>`${x(i)},${y(p.w)}`).join(" ");
  const area = `${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}`;
  const last = pts.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de peso">${grid}
    <line class="goal" x1="${L}" x2="${W-R}" y1="${y(s.goal)}" y2="${y(s.goal)}"/><text x="${W-R}" y="${y(s.goal)-4}" text-anchor="end">meta</text>
    <polygon class="area" points="${area}" opacity=".6"/><polyline class="line" points="${line}"/>
    ${pts.map((p,i)=>i===last?"":`<circle class="dot" cx="${x(i)}" cy="${y(p.w)}" r="3"/>`).join("")}
    <circle class="last" cx="${x(last)}" cy="${y(pts[last].w)}" r="5"/>
    <text x="${x(0)}" y="${H-6}">${pts[0].d}</text><text x="${x(last)}" y="${H-6}" text-anchor="end">${pts[last].d}</text></svg>`;
}

        <div class="field"><label for="fg">Meta de jejum (horas)</label><input type="number" id="fg" min="8" max="20" value="${p.fastGoal}"></div>
      </div><p class="note" style="margin-top:8px">Pelo seu plano, do jantar das 22h ao café das 9h são 11 horas.</p>
      <button class="toggle" type="button" role="switch" id="smenu" aria-checked="${p.showMenu!==false}" style="margin-top:10px"><span><b>Mostrar o cardápio da nutricionista</b><br><span class="note">Desligue se você segue outro plano.</span></span><span class="sw"></span></button>
    </section>
    <section class="card stack"><div class="card-head" style="margin:0"><h2>Refeição livre</h2></div>
      <p class="note" style="margin:0">Cumpra a missão e ganhe uma refeição do que você gosta, sem culpa.</p>
      <div class="two"><div class="field"><label for="tt">Prêmio</label><input type="text" id="tt" maxlength="40" value="${esc(treat().title)}"></div>
      <div class="field"><label for="te">Ícone</label><input type="text" id="te" maxlength="4" value="${treat().em}"></div></div>
      <div class="field"><label>Período da missão</label><div class="choice" id="tp"><button type="button" data-p="semana" aria-pressed="${treat().period!=="mes"}">Semana</button><button type="button" data-p="mes" aria-pressed="${treat().period==="mes"}">Mês</button></div></div>
      <div class="field"><label for="tpct">Refeições no plano exigidas (%)</label><input type="number" id="tpct" min="50" max="100" step="5" value="${treat().pct}"></div>
      <p class="note" style="margin:0">Com 90% na semana, são 26 das 28 refeições.</p>
    </section>
    ${editing?"":`<section class="card"><h2>Recompensas sugeridas</h2><p class="note">Você muda, apaga ou cria outras depois, na aba Prêmios.</p>
      <div class="history num">${p.rewards.map(r=>`<div><b>${esc(r.title)}</b><span>${r.points.toLocaleString("pt-BR")} pts</span></div>`).join("")}</div></section>`}
    <button class="btn block" id="save" style="padding:15px">${editing?"Salvar ajustes":"Começar a jornada"}</button>
    ${editing?`<p class="note">Seus dados ficam salvos na sua conta do Claude. Mudar os hábitos recalcula os pontos dos dias anteriores.</p>`:""}
  </div>`);
  let tperiod = treat().period, showMenu = p.showMenu!==false;
  frag.getElementById("smenu").onclick = e => { showMenu=!showMenu; e.currentTarget.setAttribute("aria-checked", showMenu); };
  frag.querySelectorAll("#tp button").forEach(b=>b.onclick=()=>{ tperiod=b.dataset.p; b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
  const hl = frag.getElementById("hl");
  for (const h of HABITS){
    const b = $(`<button class="habit ${sel.has(h.id)?"done":""}" type="button" aria-pressed="${sel.has(h.id)}" ${h.fixed?"disabled":""}><span class="ico">${h.ico}</span><span class="tx"><b>${h.nome}</b><span>${h.desc}${h.pts?` · +${h.pts}`:""}</span></span><span class="chk">✓</span></button>`).firstElementChild;
    b.onclick = () => { sel.has(h.id)?sel.delete(h.id):sel.add(h.id); b.classList.toggle("done"); b.setAttribute("aria-pressed", sel.has(h.id)); };
    hl.append(b);
  }
  frag.getElementById("save").onclick = () => {
    const num = id => parseFloat(String(document.getElementById(id).value).replace(",","."));
    const sw=num("sw"), gw=num("gw");
    if (!(sw>30) || !(gw>30)) return toast("Preencha o peso inicial e a meta");
    if (gw>=sw) return toast("A meta precisa ser menor que o peso inicial");
    S.profile = {...p, startWeight:sw, goalWeight:gw, habits:[...sel], waterL:Math.min(6,Math.max(1,num("wg")||3)), fastGoal:Math.max(8,num("fg")||12), created:p.created||today(), showMenu,
      treat:{title:document.getElementById("tt").value.trim()||"Pizza", em:document.getElementById("te").value.trim()||"🍕", period:tperiod, pct:Math.min(100,Math.max(50,num("tpct")||90))}};
    saveProfile(); syncRank(); S.tab="hoje";
    if (!editing) modal("🌱","Jornada começou!","Marque suas refeições, a água e o jejum ao longo do dia. Cada coisa cumprida vira pontos."); else toast("Ajustes salvos");
    render();
  };
  return frag;
}

document.getElementById("tabs").addEventListener("click", e => { const b=e.target.closest("button[data-tab]"); if(!b) return; S.tab=b.dataset.tab; if (S.tab==="hoje") S.day=today(); render(); scrollTo(0,0); });
render();
connect();
setTimeout(()=>{ if(!S.ready) finishBoot(); }, 11000);
})();
</script>
